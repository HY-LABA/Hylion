# 004_a2_310ep_empty1_sched_sync_bf16_b6_wrist_rot180 — smoke test (100 step)
#
# 본 학습 진입 전 *custom_train.py + WristRotatedLeRobotDataset* 검증.
# 핵심 변경 vs 003 smoke:
#   - wrist_rotation_deg: 180 (custom_train.py 가 적용)
#   - 나머지 003 smoke 와 동일
#
# 통과 기준:
#   - 100 step 정상 완주
#   - VRAM peak < 80% (003 smoke 3 = 79.52%, 본 분기는 동일 영역 기대)
#   - wandb config 에 wrist_rotation_deg=180 반영 확인
#   - loss 정상 강하 (003 smoke 와 유사 영역)
#   - WristRotatedLeRobotDataset 의 __getitem__ override 가 wrist 만 회전하는지 검증
#     (custom_train.py 가 시작 시 sanity check 출력)

policy_path: lerobot/smolvla_base
method: lora
lora:
  target_modules: all-linear
  r: 16
batch_size: 6
steps: 100                           # smoke
num_workers: 4
save_freq: 50                        # smoke 50 (100 step 안 ckpt 2회)
log_freq: 10                         # smoke 10 (분해능 ↑)
wandb_enable: true
device: cuda
push_to_hub: false

dataset_return_uint8: true
prefetch_factor: 2
persistent_workers: false
video_backend: torchcodec

# 003 신규 변수 유지
empty_cameras: 1
scheduler_decay_steps: 100           # smoke step 수와 동기화

# ── 본 분기 신규 변수 ──
wrist_rotation_deg: 180

# smoke 는 100ep subset (003 smoke 와 동일)
dataset_subset_2a:
  episode_ranges_inclusive:
    - [0, 99]
