# leftarm_v2 — 데이터 수집 job 파라미터 (lerobot-record). realplaying.md M1.
# 물리 셋업(robot·teleop·cameras·hardware·calibration)·식별·저장·계정은 base_config.yaml 참조.
# 본 파일은 "무엇을·어떻게 수집할지" 만 — dataset 옵션 / record 옵션 / task.

dataset:                          # → lerobot-record --dataset.*
  fps: 30
  episode_time_s: 60              # 상한값 — →키로 일찍 종료. pick-place 실길이 12~15s 예상
  reset_time_s: 5                 # episode 간 리셋 시간 (7차에서 15→7 단축, 시연 숙달 반영)
  video: true
  vcodec: h264_nvenc               # GPU NVENC 코덱 — Walking RL 미가동 시 채택 (libsvtav1 CPU 병목 회피, camera_and_codec.md §3)
  streaming_encoding: true
  push_to_hub: true               # 차수마다 Hub 증분 백업. push_dataset_hub.sh 는 크래시 복구용
  private: false
  tags: [smolvla, so101, leftarm, pick-place, hylion]

record_opts:                      # → lerobot-record 최상위 인자 (--dataset.* 아님)
  display_data: true              # Rerun viewer 표시 (수집/텔레옵 중 영상 확인)
  play_sounds: false              # 녹화 시작/종료 오디오 큐

# 멀티태스크 — 단일 leftarm_v2 dataset 에 instruction 별 수집.
# 2026-05-15: task 정의 진화 — task 1 은 "테이블 왼쪽" spatial reference 로, task 2 는 pick-place
# 가 아닌 "사람에게 건네기" hand-over 로 변경. 원래 "노란 플라스틱 상자" 기반 설계는 폐기
# (top view 가동범위 제약 + task 다양성 확보). collection_log.md 참조.
#
# ⚠️ target_episodes = task 별 수집 *목표* 총량 (기록·참조용). run_record.py 가 이 값으로
#    한꺼번에 수집하지 않는다. 실제 수집은 차수(batch)별로:
#      python run_record.py record --task N --episodes M   ← M = 이번 차수 분량
#    (lerobot num_episodes 시맨틱 = 이번 세션 추가분, 누적 아님. 예: 20×5 차수 → 100)
tasks:
  - instruction: "Pick up the blue and yellow doll and place it on the left side of the table"
    target_episodes: 200    # 2026-05-18 100→200 갱신 (자세한 근거: collection_log.md §Orientation 합계)
  - instruction: "Hand the yellow can to the person"
    target_episodes: 200    # 2026-05-18 100→200 갱신
