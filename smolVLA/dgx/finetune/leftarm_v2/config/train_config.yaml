# leftarm_v2 — 학습 설정 (lerobot-train). realplaying.md M2.
# 식별·저장위치·계정(wandb 포함)은 base_config.yaml 참조 (래퍼가 merge).
#
# 2A first pass (100ep balanced subset → 사이클 검증 + 조기 성능 평가).
# 결정 근거: dgx/docs/finetune/leftarm_v2/model_config.md (4축 분석 → A2 채택).
# 2B (200ep 완성 후) 에서 hyperparameter 정밀 튜닝 — 본 파일은 그때 갱신.
#
# 참고 (leftarm_v1 실행값): LoRA all-linear r=16 / batch 16 / 5000 steps (500 조기중단).
# 상세: dgx/docs/finetune/training.md, status.md §4.

policy_path: lerobot/smolvla_base    # 사전학습 체크포인트 (v1 동일)
method: lora                         # A2: VLM + expert 양쪽에 LoRA adapter (base frozen, adapter trainable)
lora:
  target_modules: all-linear         # 모델 내 모든 linear layer (VLM + expert)
  r: 16                              # rank — v1 검증값
batch_size: 16                       # v1 동일 — 2B 에서 증가 시도 가능
steps: 20000                         # ~5.3 epoch on 100ep (60k frames, batch 16 → 1 epoch ≈ 3,750 step)
num_workers: 8                       # Walking RL 미가동 가정 (가동 시 4 로 낮춤)
save_freq: 1000                      # checkpoint 저장 step 주기
log_freq: 50                         # wandb/console 로그 step 주기 (default 200, v1 동일)
wandb_enable: true                   # entity·project 는 base_config.accounts (BaboGaeguri / leftarm_v2)
device: cuda                         # auto-select 비의존 — DGX GB10 명시
push_to_hub: false                   # 체크포인트 자동 Hub push X (DGX→Orin 수동 전송 흐름)

# 2A dataset subset — run_train.py 가 episode index 리스트로 expand 해 --dataset.episodes 로 전달.
# P 방식 (100ep balanced): task1 [0..49] + task2 [50..99] = ep 0~99 연속.
# 양 task 모두 front:back = 30:20 (6:4 일관 편향, task 간 비교 깔끔).
dataset_subset_2a:
  episode_ranges_inclusive:
    - [0, 99]                        # = list(range(0, 100)) — 100 ep balanced
