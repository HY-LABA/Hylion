# leftarm_v2 — 학습 설정 (lerobot-train). realplaying.md M2.
# 식별·저장위치·계정(wandb 포함)은 base_config.yaml 참조 (래퍼가 merge).
#
# 2A first pass (100ep balanced subset → 사이클 검증 + 조기 성능 평가).
# 결정 근거: dgx/docs/finetune/leftarm_v2/model_config.md (4축 분석 → A2 채택).
# 2B (200ep 완성 후) 에서 hyperparameter 정밀 튜닝 — 본 파일은 그때 갱신.
#
# 참고 (leftarm_v1 실행값): LoRA all-linear r=16 / batch 16 / 5000 steps (500 조기중단).
# 상세: dgx/docs/finetune/leftarm_v1/training.md, status.md §4.

policy_path: lerobot/smolvla_base    # 사전학습 체크포인트 (v1 동일)
method: lora                         # A2: VLM + expert 양쪽에 LoRA adapter (base frozen, adapter trainable)
lora:
  target_modules: all-linear         # 모델 내 모든 linear layer (VLM + expert)
  r: 16                              # rank — v1 검증값
batch_size: 16                       # v1 동일 — 2B 에서 증가 시도 가능
steps: 20000                         # ~5.3 epoch on 100ep (60k frames, batch 16 → 1 epoch ≈ 3,750 step)
num_workers: 2                       # 시도 1 OOM 분석 (training_log.md §시도1) 후 8→2 축소.
                                     # wandb 증거상 GPU 12W idle 이라 throughput 손해 X — workers 축소가 메모리 누수 직접 타격.
save_freq: 1000                      # checkpoint 저장 step 주기
log_freq: 50                         # wandb/console 로그 step 주기 (default 200, v1 동일)
wandb_enable: true                   # entity·project 는 base_config.accounts (BaboGaeguri / leftarm_v2)
device: cuda                         # auto-select 비의존 — DGX GB10 명시
push_to_hub: false                   # 체크포인트 자동 Hub push X (DGX→Orin 수동 전송 흐름)

# DGX UMA 128GB 메모리 안정 옵션 — 시도 2 패키지 (training_log.md §시도1 OOM 분석 반영).
# X' (시도 1: workers=8, prefetch=2) 가 step 368 에서 system OOM (5GB/min 누수). wandb 증거상
# main process 3.4GB 안정 / system 95GB 증발 / GPU 12W idle → DataLoader workers 가 주범.
# 시도 2 buffer = workers 2 × prefetch 1 = 2 batch (X' 의 1/8, v1 default 의 1/16).
# video decode backend — 명시 pyav 강제. (2026-05-16 사고 분석)
# 환경: DGX (torch 2.10.0+cu130, torchcodec 0.11.1, ffmpeg 6.1.1) 에서
# torchcodec 의 FFmpeg6 wheel 이 PyTorch 의 새 dtype symbol (torch_dtype_float4_e2m1fn_x2) 을 요구하나
# 현 환경 PyTorch 가 export 하지 않아 dataloader 첫 배치 fetch 시 즉시 RuntimeError.
# lerobot default get_safe_default_codec() 는 torchcodec module import 가능성만 보고 선택해
# 우리 환경에서 실패. 따라서 명시 pyav 강제. researcher 보고서
# `docs/work_flow/context/research/m1.5_video_decode_oom.md` §3, ANOMALIES #2·#3 참조.
dataset_video_backend: pyav
dataset_return_uint8: true           # float32→uint8 (IPC 1/4 메모리, GPU 변환 — 정확도 영향 0)
prefetch_factor: 1                   # 2 → 1. prefetch buffer 추가 축소 (workers × prefetch = 2)
persistent_workers: false            # 무해 유지 (시도 1 OOM 은 단일 epoch 내라 효과 없었음)

# 2A dataset subset — run_train.py 가 episode index 리스트로 expand 해 --dataset.episodes 로 전달.
# P 방식 (100ep balanced): task1 [0..49] + task2 [50..99] = ep 0~99 연속.
# 양 task 모두 front:back = 30:20 (6:4 일관 편향, task 간 비교 깔끔).
dataset_subset_2a:
  episode_ranges_inclusive:
    - [0, 99]                        # = list(range(0, 100)) — 100 ep balanced
